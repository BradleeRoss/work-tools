<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="pomodoro-app">
    <div class="top-bar">
      <div class="status-badge" id="status-badge">Focus Time</div>
      <div class="view-buttons">
        <button onclick="togglePip()">PiP</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>
      </div>
    </div>

    <h1>Pomodoro Timer</h1>

    <div class="time-inputs">
      <div class="input-group">
        <label for="focus-input">Focus (min)</label>
        <input type="number" id="focus-input" value="25" min="1" max="180" onchange="updateCustomTimes()">
      </div>
      <div class="input-group">
        <label for="break-input">Break (min)</label>
        <input type="number" id="break-input" value="5" min="1" max="60" onchange="updateCustomTimes()">
      </div>
    </div>

    <div class="timer-display" id="timer">25:00</div>

    <div class="controls">
      <button id="start-btn" onclick="startTimer()">Start</button>
      <button id="pause-btn" onclick="pauseTimer()" disabled>Pause</button>
      <button id="reset-btn" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
